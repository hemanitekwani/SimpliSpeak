<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334"/></marker>
    <style>
      .box{fill:#fff;stroke:#9fb0e0;stroke-width:1.4}
      .key{fill:#2448d8;stroke:#2448d8}
      .loop{fill:#f3f6ff;stroke:#2448d8;stroke-width:1.6}
      .end{fill:#fff7e6;stroke:#e0b45a;stroke-width:1.4}
      .t{font-size:13px;font-weight:700;fill:#10162a}
      .tw{font-size:13px;font-weight:700;fill:#fff}
      .s{font-size:11px;fill:#3d4660}
      .sw{font-size:11px;fill:#e8edff}
      .lab{font-size:11px;fill:#334;font-style:italic}
      .a{stroke:#334;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <!-- Row 1 -->
  <rect class="key" x="10" y="20" width="170" height="86" rx="12"/>
  <text class="tw" x="24" y="46">1 · Opening screen</text>
  <text class="sw" x="24" y="66">"Tap anywhere to start"</text>
  <text class="sw" x="24" y="82">(one tap unlocks speech)</text>
  <path class="a" d="M180,63 L218,63" marker-end="url(#ar)"/>
  <rect class="box" x="220" y="20" width="200" height="86" rx="12"/>
  <text class="t" x="234" y="46">2 · Way of using it</text>
  <text class="s" x="234" y="66">Touch mode (cannot see)</text>
  <text class="s" x="234" y="81">Buttons (can see / helper)</text>
  <text class="s" x="234" y="96">Screen-reader mode</text>
  <path class="a" d="M420,63 L458,63" marker-end="url(#ar)"/>
  <rect class="box" x="460" y="20" width="230" height="86" rx="12"/>
  <text class="t" x="474" y="46">3 · Home — read aloud</text>
  <text class="s" x="474" y="66">Paste · Photo · Example · Type</text>
  <text class="s" x="474" y="81">English / हिंदी</text>
  <text class="s" x="474" y="96">then listens for the answer</text>
  <path class="a" d="M690,63 L728,63" marker-end="url(#ar)"/>
  <rect class="box" x="730" y="20" width="220" height="86" rx="12"/>
  <text class="t" x="744" y="46">4 · Simplify</text>
  <text class="s" x="744" y="66">split → AI (or saved answer,</text>
  <text class="s" x="744" y="81">or offline rules) → guard</text>
  <text class="s" x="744" y="96">"Simplifying…" + ticking sound</text>
  <path class="a" d="M840,106 L840,150" marker-end="url(#ar)"/>

  <!-- Reading loop -->
  <rect class="loop" x="300" y="152" width="650" height="160" rx="16"/>
  <text class="t" x="318" y="178">5 · Reading loop — one sentence at a time, highlighted on screen</text>
  <text class="s" x="318" y="198">Intro: title, number of parts, level, how to give a command. Default level: Simple.</text>
  <rect class="box" x="318" y="210" width="196" height="88" rx="10"/>
  <text class="t" x="330" y="232">Move</text>
  <text class="s" x="330" y="250">next · back · repeat</text>
  <text class="s" x="330" y="265">tap a sentence to jump</text>
  <text class="s" x="330" y="280">pause · play · speed</text>
  <rect class="box" x="526" y="210" width="196" height="88" rx="10"/>
  <text class="t" x="538" y="232">Change the wording</text>
  <text class="s" x="538" y="250">simpler · more detail</text>
  <text class="s" x="538" y="265">(same sentence re-read)</text>
  <text class="s" x="538" y="280">original (exact words)</text>
  <rect class="box" x="734" y="210" width="200" height="88" rx="10"/>
  <text class="t" x="746" y="232">Get help</text>
  <text class="s" x="746" y="250">what does &lt;word&gt; mean</text>
  <text class="s" x="746" y="265">where am I · help</text>
  <text class="s" x="746" y="280">read screen</text>
  <path class="a" d="M300,232 C250,232 250,190 298,186" marker-end="url(#ar)"/>
  <text class="lab" x="200" y="214">after each</text>
  <text class="lab" x="200" y="228">sentence:</text>
  <text class="lab" x="200" y="242">next one</text>

  <!-- End -->
  <path class="a" d="M520,312 L520,346" marker-end="url(#ar)"/>
  <text class="lab" x="528" y="336">after the last sentence</text>
  <rect class="end" x="420" y="348" width="210" height="62" rx="12"/>
  <text class="t" x="434" y="372">6 · "Was it clear?"</text>
  <text class="s" x="434" y="390">say yes / no (हाँ / नहीं) or press</text>
  <path class="a" d="M630,380 L700,380" marker-end="url(#ar)"/>
  <text class="lab" x="640" y="372">yes</text>
  <rect class="box" x="702" y="348" width="248" height="62" rx="12"/>
  <text class="t" x="716" y="372">Done</text>
  <text class="s" x="716" y="390">listen again · other level · new text</text>
  <path class="a" d="M420,380 C330,380 290,345 300,312" marker-end="url(#ar)"/>
  <text class="lab" x="40" y="372">no → start again from sentence 1,</text>
  <text class="lab" x="40" y="386">one level simpler</text>
</svg>
