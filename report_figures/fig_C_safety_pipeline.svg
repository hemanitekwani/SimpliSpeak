<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334"/></marker>
    <style>
      .box{fill:#fff;stroke:#9fb0e0;stroke-width:1.4}
      .dec{fill:#f3f6ff;stroke:#2448d8;stroke-width:1.4}
      .acc{fill:#fff7e6;stroke:#e0b45a;stroke-width:1.4}
      .bad{fill:#fdeeee;stroke:#d9a0a0;stroke-width:1.4}
      .t{font-size:12.5px;font-weight:700;fill:#10162a}
      .s{font-size:11px;fill:#3d4660}
      .lab{font-size:11px;fill:#334;font-style:italic}
      .a{stroke:#334;stroke-width:1.5;fill:none}
      .h{font-size:13px;font-weight:700;fill:#2448d8}
    </style>
  </defs>
  <text class="h" x="10" y="18">On the laptop (server)</text>
  <rect class="box" x="10" y="30" width="120" height="58" rx="10"/>
  <text class="t" x="22" y="54">Text in</text>
  <text class="s" x="22" y="72">paste · photo · type</text>
  <path class="a" d="M130,59 L158,59" marker-end="url(#ar)"/>
  <rect class="box" x="160" y="30" width="140" height="58" rx="10"/>
  <text class="t" x="172" y="54">Split</text>
  <text class="s" x="172" y="72">into sentences</text>
  <path class="a" d="M300,59 L328,59" marker-end="url(#ar)"/>
  <rect class="dec" x="330" y="30" width="130" height="58" rx="10"/>
  <text class="t" x="342" y="54">Saved answer?</text>
  <text class="s" x="342" y="72">same text + language</text>
  <path class="a" d="M460,59 L488,59" marker-end="url(#ar)"/>
  <text class="lab" x="465" y="50">no</text>
  <rect class="box" x="490" y="30" width="200" height="58" rx="10"/>
  <text class="t" x="502" y="54">Gemini model chain</text>
  <text class="s" x="502" y="72">3 levels + glossary (JSON)</text>
  <path class="a" d="M690,59 L840,59 L840,108" marker-end="url(#ar)"/>
  <text class="lab" x="700" y="50">ok</text>

  <path class="a" d="M590,88 L590,116" marker-end="url(#ar)"/>
  <text class="lab" x="598" y="106">fails</text>
  <rect class="bad" x="490" y="118" width="200" height="56" rx="10"/>
  <text class="t" x="502" y="142">Offline rules (English)</text>
  <text class="s" x="502" y="160">+ spoken notice saying why</text>
  <path class="a" d="M690,146 L728,146" marker-end="url(#ar)"/>

  <path class="a" d="M395,88 L395,200 L800,200 L800,172" marker-end="url(#ar)"/>
  <text class="lab" x="404" y="194">yes: the saved answer (still checked)</text>

  <rect class="acc" x="730" y="110" width="220" height="62" rx="10"/>
  <text class="t" x="742" y="134">Guard, for every level</text>
  <text class="s" x="742" y="152">lost a number or a warning?</text>
  <text class="s" x="742" y="166">→ mark that level "unsure"</text>
  <path class="a" d="M900,172 L900,240" marker-end="url(#ar)"/>

  <text class="h" x="10" y="262">On the phone, for each sentence</text>
  <rect class="box" x="700" y="242" width="250" height="56" rx="10"/>
  <text class="t" x="712" y="266">Document → phone</text>
  <text class="s" x="712" y="284">sentence × 4 levels + glossary + flags</text>
  <path class="a" d="M700,270 L612,270" marker-end="url(#ar)"/>
  <rect class="dec" x="420" y="242" width="190" height="56" rx="10"/>
  <text class="t" x="432" y="266">Chosen level safe?</text>
  <text class="s" x="432" y="284">(not marked "unsure")</text>
  <path class="a" d="M420,270 L352,270" marker-end="url(#ar)"/>
  <text class="lab" x="366" y="262">yes</text>
  <rect class="box" x="210" y="242" width="140" height="56" rx="10"/>
  <text class="t" x="222" y="266">Read it</text>
  <text class="s" x="222" y="284">in the chosen level</text>
  <path class="a" d="M515,298 L515,330" marker-end="url(#ar)"/>
  <text class="lab" x="522" y="318">no</text>
  <rect class="acc" x="300" y="332" width="440" height="56" rx="10"/>
  <text class="t" x="312" y="355">Warn (soft double beep + "Careful: …"), then read the next</text>
  <text class="s" x="312" y="374">fuller level that kept every fact (Simple → Light); English Original only if none did</text>
  <text class="s" x="10" y="350">Example (bill, Hindi, Very simple):</text>
  <text class="s" x="10" y="366">"1 to 30 September" was dropped →</text>
  <text class="s" x="10" y="382">the app read the Simple Hindi line.</text>
</svg>
